<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            background: #FFFFFF;
        }

        .loader {
            width: 370px;
            margin: 0 auto;
            border-radius: 10px;
            border: 4px solid transparent;
            position: relative;
            padding: 1px;
            margin-top: 140px;
        }

        .loader:before {
            content: '';
            border: 1px solid #d41616;
            border-radius: 10px;
            position: absolute;
            top: -4px;
            right: -4px;
            bottom: -4px;
            left: -4px;
        }

        .loader .loaderBar {
            position: absolute;
            border-radius: 10px;
            top: 0;
            right: 100%;
            bottom: 0;
            left: 0;
            background: #d41616;
            width: 0;
            animation: borealisBar 1s linear infinite;
        }

        @keyframes borealisBar {
            0% {
                left: 0%;
                right: 100%;
                width: 0%;
            }

            10% {
                left: 0%;
                right: 75%;
                width: 25%;
            }

            90% {
                right: 0%;
                left: 75%;
                width: 25%;
            }

            100% {
                left: 100%;
                right: 0%;
                width: 0%;
            }
        }
    </style>

</head>



<body style="text-align: center">
    <img src="./img/logo.png" style="position:absolute; top:0px; left:0px;">
    <!--<div class="loader">
        <div class="loaderBar"></div>
    </div>-->
</body>

</html>
